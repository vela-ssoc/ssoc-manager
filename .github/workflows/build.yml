# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: 编译

on:
  workflow_dispatch:
  push:
    branches:
      - v3
#  pull_request:
#    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: linux
            arch: amd64
          - os: android
            arch: arm64
          - os: windows
            arch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go environment
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          cache: npm
          cache-dependency-path: resources/devui/package-lock.json

      - name: Build Backend ${{ matrix.target.os }}-${{ matrix.target.arch }}
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Build Frontend
        working-directory: resources/devui
        run: |
          npm ci
          npm run build

      - name: Set Artifact name
        id: artifact
        run: echo "name=ssoc-manager-${{ matrix.target.os }}-${{ matrix.target.arch }}-$(date -u '+%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            ssoc-manager-${{ matrix.target.os }}-${{ matrix.target.arch }}-*
            resources/static
            VERSION